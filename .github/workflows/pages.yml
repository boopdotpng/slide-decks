# builds every deck (lec*/*/slides) and publishes them to github pages:
#   <site>/<lec>-<topic>/   plus an index at the root
# <site> is https://<user>.github.io/<repo> or the custom domain set in the repo's pages settings
# (slides.anuraagw.me); configure-pages hands back the matching base path, so nothing here changes.
# a new deck is picked up as soon as lecN/<topic>/slides exists with a bun.lock.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v5
      - name: build decks
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p _site
          links=""
          for d in lec*/*/slides; do
            name=$(dirname "$d" | tr / -)
            title=$(sed -nE "s/^export const title = ['\"](.*)['\"];?/\1/p" "$d/src/deck.config.ts")
            echo "::group::$name"
            (cd "$d" && bun install --frozen-lockfile && bunx astro build --base "$BASE/$name" --outDir "$GITHUB_WORKSPACE/_site/$name")
            echo "::endgroup::"
            links="$links<li><a href=\"$name/\">$name</a> — ${title:-$name}</li>"
          done
          cat > _site/index.html <<EOF
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>slide decks</title>
          <style>body{font:18px/1.6 system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem}</style>
          <h1>slide decks</h1><ul>$links</ul>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
